# Lean by design: Actions minutes and artifact storage are metered on private repositories.
# One Linux job runs the same checks as `python tools/check.py --quick` locally (unit, server, smoke).
# The full suite runs on demand.
name: check

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'deck/**', '*.pdf']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'deck/**', '*.pdf']
  workflow_dispatch:
    inputs:
      full:
        description: Run every test suite (slower)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest        # has Google Chrome; tools/cdp.py finds it
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Checks and tests
        run: python tools/check.py ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && ' ' || '--quick' }}
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output/
          retention-days: 7
      - name: Keep the built file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OceanLens3D
          path: dist/*.html
          retention-days: 7
