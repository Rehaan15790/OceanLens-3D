# Lean by design: a short run gives fast feedback, and it stays cheap if the repository is ever made private again.
# One Linux job runs the same checks as `python tools/check.py --quick` locally (unit, server, smoke).
# The full suite runs on demand.
name: check

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'deck/**', '*.pdf']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'deck/**', '*.pdf']
  workflow_dispatch:
    inputs:
      full:
        description: Run every test suite (slower)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest        # has Google Chrome; tools/cdp.py finds it
    timeout-minutes: 15
    # Actions are pinned to the commit each tag pointed at on 2026-10-07 (git ls-remote); bump them on purpose.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Checks and tests
        run: python tools/check.py ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && ' ' || '--quick' }}
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-output
          path: tests/output/
          retention-days: 7
      - name: Keep the built file
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OceanLens3D
          path: dist/*.html
          retention-days: 7
